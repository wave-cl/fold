// fold wire protocol, version 1.
//
// Four services keep command/query responsibility segregation visible in
// every generated client:
//
//   Command  the write side: execute a declared command, or append raw events
//   Query    the read side: projections only, with a read-your-writes token
//   Log      event reads, subscriptions and aggregate state, for integration
//            and debugging; never a read model for application code
//   Admin    schema, projection status, health
//
// Payloads, rows and state cross the wire as bytes with a content type, which
// is always "application/json" in this version.

syntax = "proto3";

package fold.v1;

// ---------------------------------------------------------------------------
// Shared messages

message ExpectedVersion {
  oneof kind {
    bool any = 1;            // no check
    bool no_stream = 2;      // the stream must not exist yet
    bool stream_exists = 3;  // the stream must exist, any version
    uint64 exact = 4;        // the stream's last event must have this version
  }
}

message NewEvent {
  string type = 1;           // "Context.Event" or "Context.Event@vN"; no version = latest
  bytes payload = 2;
  string content_type = 3;   // "application/json"
  bytes metadata = 4;        // JSON object, or empty
}

message RecordedEvent {
  string id = 1;             // uuid v7
  string stream_id = 2;
  uint64 version = 3;        // 0-based, per stream
  uint64 position = 4;       // 0-based, global
  string type = 5;           // "Context.Event@vN"
  bytes payload = 6;
  string content_type = 7;
  bytes metadata = 8;
  int64 recorded_at_unix_nanos = 9;
}

message ProjectionRow {
  bytes key = 1;             // JSON object of the table's key fields
  bytes row = 2;             // JSON object of the table's columns
  string content_type = 3;
}

// ---------------------------------------------------------------------------
// Command: the write side

service Command {
  // Run a declared command against an aggregate instance: load its state,
  // call the WASM handler, validate and append the emitted events.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // Append events without a handler. The escape hatch for migrations and
  // tests; the events are still validated and the stream id enforced.
  rpc Append(AppendRequest) returns (AppendResponse);
}

message ExecuteRequest {
  string command = 1;        // "Context.Aggregate.Command"
  string stream_id = 2;      // must render from the aggregate's stream template
  bytes payload = 3;
  string content_type = 4;
  bytes metadata = 5;        // attached to every emitted event
  // Fencing: the epoch the client believes current (Health.epoch). A stale
  // token is refused; a newer one fences this daemon, which then refuses
  // every write.
  optional uint64 fencing_token = 6;
}

message ExecuteResponse {
  repeated RecordedEvent events = 1;   // empty when the handler emitted nothing
  uint64 first_position = 2;           // meaningful only when events is non-empty
  uint64 last_position = 3;            // pass to Query.min_position for read-your-writes
  optional uint64 version = 4;         // the stream's version after the command; absent if still empty
  // Position token for read-your-writes on any member of the cluster:
  // "fold1:<log_id>:<epoch>:<position>". Pass it as Query.token; a replica
  // answers once it has replicated and projected that position, and a
  // token from another log is refused.
  string token = 5;
}

message AppendRequest {
  string stream_id = 1;
  ExpectedVersion expected = 2;
  repeated NewEvent events = 3;
  optional uint64 fencing_token = 4;   // as on ExecuteRequest
}

message AppendResponse {
  uint64 first_position = 1;
  uint64 last_position = 2;
  uint64 version = 3;
  string token = 4;          // as on ExecuteResponse
}

// ---------------------------------------------------------------------------
// Query: the read side

service Query {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Scan(ScanRequest) returns (stream ProjectionRow);
}

message GetRequest {
  string projection = 1;     // "Context.Projection"
  string table = 2;
  bytes key = 3;             // JSON object of the table's key fields
  // Read-your-writes: wait until the projection has processed this position.
  optional uint64 min_position = 4;
  optional uint32 wait_ms = 5;   // default 5000, max 30000
  // Read-your-writes with the token a write returned (ExecuteResponse.token);
  // checked to be of this log, then waited for like min_position.
  string token = 6;
}

message GetResponse {
  bool found = 1;
  ProjectionRow row = 2;
  optional uint64 checkpoint = 3;   // last position the projection has applied
  // Session token: the state this read saw, as a position token. Pass it as
  // `token` on the next read, on any member, and that read is at least this
  // far along: a client's reads never go backwards. (Scan returns the same
  // in the response's initial metadata, header `fold-session`.)
  string token = 4;
}

message ScanRequest {
  string projection = 1;
  string table = 2;
  bytes key_prefix = 3;      // JSON object of the leading key fields, or empty
  uint32 limit = 4;          // 0 = server default
  optional uint64 min_position = 5;
  optional uint32 wait_ms = 6;
  string token = 7;          // as on GetRequest
}

// ---------------------------------------------------------------------------
// Log: events and aggregate state, for integration and debugging

service Log {
  rpc ReadStream(ReadStreamRequest) returns (stream RecordedEvent);
  rpc ReadAll(ReadAllRequest) returns (stream RecordedEvent);
  // Catch up from a position, then stay live. Never ends on its own.
  rpc SubscribeAll(SubscribeAllRequest) returns (stream RecordedEvent);
  // Current state of one aggregate instance: snapshot plus replay.
  rpc GetAggregate(GetAggregateRequest) returns (GetAggregateResponse);
  // Current state of one process manager instance, for debugging.
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);
  // Tail the log as raw records for a replica: chunks from a position,
  // each ending on a batch boundary, then live. Never ends on its own.
  rpc Replicate(ReplicateRequest) returns (stream ReplicationChunk);
}

message GetProcessRequest {
  string process = 1;        // "Context.Process"
  bytes key = 2;             // JSON value of the correlation key
}

message GetProcessResponse {
  bool found = 1;            // false before the first trigger or after the instance ended
  bytes state = 2;
  string content_type = 3;
}

message ReadStreamRequest {
  string stream_id = 1;
  uint64 from_version = 2;
  uint32 max = 3;            // 0 = to the end
  bool backward = 4;
}

message ReadAllRequest {
  uint64 from_position = 1;
  uint32 max = 2;            // 0 = to the end
}

message SubscribeAllRequest {
  uint64 from_position = 1;
}

message ReplicateRequest {
  uint64 from_position = 1;   // the replica's head
  string last_event_id = 2;   // id of the replica's last event (from_position - 1); empty at 0
}

message ReplicationChunk {
  string log_id = 1;
  uint64 from = 2;
  uint64 to = 3;              // exclusive; a batch boundary
  bytes frames = 4;           // the records as framed on disk
  repeated IdempotencyKey keys = 5;   // first used at a position in from..to
  uint64 head = 6;            // the primary's head when the chunk was cut
  uint64 epoch = 7;           // the primary's epoch; the replica adopts it
}

message IdempotencyKey {
  bytes key = 1;
  uint64 position = 2;
}

message GetAggregateRequest {
  string stream_id = 1;
}

message GetAggregateResponse {
  bool found = 1;                      // false for an empty stream
  string aggregate = 2;                // "Context.Aggregate"
  uint64 version = 3;
  bytes state = 4;
  string content_type = 5;
  optional uint64 snapshot_version = 6;
  uint64 replayed = 7;                 // events evolved to answer this call
}

// ---------------------------------------------------------------------------
// Admin

service Admin {
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
  rpc ListProjections(ListProjectionsRequest) returns (ListProjectionsResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc Health(HealthRequest) returns (HealthResponse);

  // Write a consistent snapshot of a projection's tables, or a process
  // manager's instances and outbox, at its checkpoint. The `projection`
  // field of these requests names either kind ("Context.Name").
  rpc SnapshotProjection(SnapshotProjectionRequest) returns (SnapshotInfo);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  // Reset a projection and replay: from scratch, or from a snapshot. Returns
  // once the reset is done; the projection then catches up in the background.
  rpc RebuildProjection(RebuildProjectionRequest) returns (RebuildProjectionResponse);

  // Write a consistent backup of the whole log (index, segments, identity,
  // schema, snapshot files) to one archive. Restoring is offline:
  // `fold restore <archive> <dir>` with the daemon stopped.
  rpc BackupLog(BackupLogRequest) returns (BackupInfo);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  // Replace the running daemon's log with a backup. The daemon stops
  // serving, moves the current log aside (it is kept, never deleted),
  // restores the archive in its place and serves again on the same address;
  // clients reconnect. The call returns once the request is accepted; poll
  // Health for log_id and last_restore.
  rpc RestoreLog(RestoreLogRequest) returns (RestoreLogResponse);
  // Failover: a replica stops tailing and becomes a primary in place. Its
  // process managers then dispatch the commands they held.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  // Fencing: tell this daemon a primary at `epoch` exists. If that is newer
  // than its own epoch it stops taking writes for good (until it is made a
  // replica of the new primary). A replica or an already fenced daemon
  // answers ok without changing.
  rpc Fence(FenceRequest) returns (FenceResponse);
  // Failover election: a replica that has lost its primary asks each peer
  // for its vote before promoting itself. A vote is granted once per epoch,
  // only to a candidate at least as far along, and only if the voter cannot
  // reach the primary either.
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  // Leader lease: a primary asks each peer to confirm it is still the
  // primary it knows for the next `duration_ms`. With a majority it serves
  // reads; without, it stops, so a partitioned primary cannot answer stale
  // reads. A peer that granted a lease votes for nobody else until it ends.
  rpc RenewLease(LeaseRequest) returns (LeaseResponse);
}

message VoteRequest {
  uint64 epoch = 1;           // the epoch the candidate proposes to start
  string log_id = 2;          // the cluster's log
  string primary = 3;         // the primary the candidate lost
  uint64 candidate_head = 4;  // how far along the candidate is
  string candidate = 5;       // the candidate's own address, for the record
}

message VoteResponse {
  bool granted = 1;
  string reason = 2;          // when not granted
  uint64 voter_epoch = 3;     // the voter's current epoch
  uint64 voted_epoch = 4;     // the highest epoch the voter has voted for
  uint64 voter_head = 5;
  bool primary_reachable = 6; // the voter could reach the primary just now
}

message LeaseRequest {
  uint64 epoch = 1;           // the holder's epoch
  string log_id = 2;
  uint64 duration_ms = 3;     // how long the holder will rely on the grant
  string holder = 4;          // the holder's address, for the record
}

message LeaseResponse {
  bool granted = 1;
  string reason = 2;          // when not granted
  uint64 peer_epoch = 3;
  uint64 voted_epoch = 4;     // a vote past the holder's epoch means an election is on
}

message FenceRequest {
  uint64 epoch = 1;           // the newer primary's epoch
}

message FenceResponse {
  string role = 1;            // "fenced", "replica" or "primary" (when epoch was not newer)
  uint64 epoch = 2;           // this daemon's own epoch
}

message PromoteRequest {}

message PromoteResponse {
  uint64 head = 1;            // where this daemon starts taking commands
  string promoted_from = 2;   // the primary it was tailing
}

message RestoreLogRequest {
  string path = 1;            // archive path on the daemon's host
  optional uint64 to = 2;     // point in time: keep only positions below this (a batch boundary)
  optional int64 at_unix_nanos = 3;  // or: keep every batch recorded at or before this instant
}

message RestoreLogResponse {
  string log_id = 1;          // of the archive
  uint64 head = 2;            // of the archive
}

message BackupLogRequest {
  // Archive path on the daemon's host; empty = <log dir>/backups/<head>-<time>.fbak
  string path = 1;
  // Write only the records since the newest backup in the backups directory
  // (full or incremental) rather than everything. Fails if there is none.
  bool incremental = 2;
}

message BackupInfo {
  string path = 1;
  string log_id = 2;
  uint64 head = 3;            // every position below it is in the backup
  uint64 files = 4;
  uint64 bytes = 5;
  int64 created_at_unix_nanos = 6;
  bool incremental = 7;
  optional uint64 base_head = 8;   // for an incremental backup: apply onto a log at this head
}

message ListBackupsRequest {}

message ListBackupsResponse {
  repeated BackupInfo backups = 1;   // in the default backups directory, newest first
  // Present when the daemon runs with a backup schedule.
  optional BackupSchedule schedule = 2;
}

message BackupSchedule {
  uint64 every_secs = 1;
  uint64 keep = 2;                       // full backups retained, newest first; 0 = all
  bool incremental = 7;                  // ticks write increments since the newest backup
  uint64 full_every = 8;                 // in incremental mode, a full backup every N backups
  optional int64 last_run_unix_nanos = 3; // last attempt
  optional uint64 last_head = 4;          // head of the last backup written
  string last_error = 5;                  // empty when the last attempt succeeded
  optional int64 next_run_unix_nanos = 6;
}

message SnapshotProjectionRequest {
  string projection = 1;               // "Context.Projection"
}

message SnapshotInfo {
  string id = 1;                       // file name inside the data dir's snapshots
  string projection = 2;
  uint64 checkpoint = 3;               // last position the snapshot includes
  uint64 rows = 4;
  uint64 bytes = 5;
  int64 created_at_unix_nanos = 6;
  // false when the projection's fold module changed since the snapshot;
  // rebuilding from it then needs force.
  bool module_matches = 7;
}

message ListSnapshotsRequest {
  string projection = 1;
}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
}

message DeleteSnapshotRequest {
  string projection = 1;
  string id = 2;
}

message DeleteSnapshotResponse {}

message RebuildProjectionRequest {
  string projection = 1;
  // Empty: from scratch (position 0). Otherwise the snapshot to start from.
  string snapshot_id = 2;
  // Accept a snapshot made by a different fold module.
  bool force = 3;
}

message RebuildProjectionResponse {
  // The checkpoint the projection restarted from; absent for scratch.
  optional uint64 restarted_from = 1;
}

message ListProcessesRequest {}

message ProcessStatus {
  string name = 1;                     // "Context.Process"
  ProjectionStatus.State state = 2;    // same lifecycle as a projection
  optional uint64 checkpoint = 3;      // last position reacted to
  uint64 head = 4;
  string error = 5;
  uint64 pending_commands = 6;         // issued but not yet executed (the outbox)
  uint64 dispatched = 7;               // commands executed since start
  uint64 rejected = 8;                 // commands refused since start
  uint64 pending_timers = 9;           // timers set and not yet fired
}

message ListProcessesResponse {
  repeated ProcessStatus processes = 1;
}

message GetSchemaRequest {}

message GetSchemaResponse {
  string source = 1;
  string path = 2;
}

message ListProjectionsRequest {}

message ProjectionStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STARTING = 1;
    CATCHING_UP = 2;
    LIVE = 3;
    FAILED = 4;
    STOPPED = 5;
    REBUILDING = 6;
  }
  string name = 1;                     // "Context.Projection"
  State state = 2;
  optional uint64 checkpoint = 3;      // last applied position; absent before the first commit
  uint64 head = 4;                     // log head (next position) when sampled
  string error = 5;
  repeated string tables = 6;
}

message ListProjectionsResponse {
  repeated ProjectionStatus projections = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;                   // "ok"
  string version = 2;
  uint64 uptime_secs = 3;
  uint64 head = 4;
  string log_id = 5;
  // After a RestoreLog: "ok <archive>" or "failed <archive>: <reason>".
  string last_restore = 6;
  string role = 7;                     // "primary" or "replica"
  string replicating_from = 8;         // the primary's address, on a replica
  bool replica_connected = 9;          // streaming from the primary right now
  optional uint64 primary_head = 10;   // the primary's head as last seen
  string replication_error = 11;       // last failure, until the next chunk
  string promoted_from = 12;           // after a promotion: the former primary
  string promotion = 13;               // "promoted from <primary> at <time> by request|automatically, ..."
  uint64 auto_failover_secs = 14;      // on a replica: grace before it promotes itself; 0 = off
  optional uint64 primary_unreachable_secs = 15;  // while the primary is out of reach
  uint64 epoch = 16;                   // the fencing epoch of this log
  optional uint64 fenced_by = 17;      // role "fenced": the newer epoch that fenced it
  bool old_primary_fenced = 18;        // after a promotion: the old primary acknowledged the fence
  uint64 quorum_size = 19;             // on a replica with auto failover: peers + 1
  string last_election = 20;           // outcome of the last election round, if any
  uint64 lease_secs = 21;              // a primary with a lease configured: its duration; 0 = none
  bool lease_held = 22;                // reads are being served under a live lease
  uint64 lease_remaining_ms = 23;      // of the current lease
  string lease_error = 24;             // why the last renewal did not grant, if it did not
  string last_schema_change = 25;      // what the start-up schema check did, if the file had changed
}

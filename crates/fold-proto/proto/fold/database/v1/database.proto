// fold wire protocol: the database service. It stores and streams events,
// validates them against the domain schema, and runs the cluster
// (replication, failover, fencing, leases) and backups. It hosts no wasm:
// aggregate state and projections are the derivation service's
// (fold.derivation.v1), commands the application service's
// (fold.application.v1).

syntax = "proto3";

package fold.database.v1;

import "fold/common/v1/common.proto";

// ---------------------------------------------------------------------------
// Log: events, streams and subscriptions

service Log {
  // Append validated events to a stream. Every event must be of a declared
  // type; payloads are canonicalized (defaults filled) before they are
  // written. The `Fold.*` context (the daemon's own events, such as
  // process timers) is accepted only with the system token in the request
  // metadata header `fold-system-token`.
  //
  //   wrong expected version   FAILED_PRECONDITION, header fold-conflict-actual-version
  //   duplicate idempotency key ALREADY_EXISTS, header fold-first-position
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc ReadStream(ReadStreamRequest) returns (stream fold.common.v1.RecordedEvent);
  rpc ReadAll(ReadAllRequest) returns (stream fold.common.v1.RecordedEvent);
  // Every event of one family (or one version of it), in position order.
  rpc ReadByType(ReadByTypeRequest) returns (stream fold.common.v1.RecordedEvent);
  rpc StreamHead(StreamHeadRequest) returns (StreamHeadResponse);
  // The ids of every stream, optionally under a prefix.
  rpc ListStreams(ListStreamsRequest) returns (stream StreamName);
  rpc LookupIdempotencyKey(LookupIdempotencyKeyRequest) returns (LookupIdempotencyKeyResponse);
  // Catch up from a position, then stay live. The first item is the log's
  // status, and a status item follows every role or epoch change. A
  // subscriber whose `last_event_id` is not the id at `from_position - 1`
  // is told its log diverged (FAILED_PRECONDITION) and must reset. Never
  // ends on its own.
  rpc SubscribeAll(SubscribeAllRequest) returns (stream LogItem);
  // Tail the log as raw records for a replica: chunks from a position,
  // each ending on a batch boundary, then live. Never ends on its own.
  rpc Replicate(ReplicateRequest) returns (stream ReplicationChunk);
}

message AppendRequest {
  string stream_id = 1;
  fold.common.v1.ExpectedVersion expected = 2;
  repeated fold.common.v1.NewEvent events = 3;
  // Fencing: the epoch the client believes current (Cluster.Health.epoch).
  // A stale token is refused; a newer one fences this database, which then
  // refuses every write.
  optional uint64 fencing_token = 4;
  // Empty: none. Otherwise the append happens at most once per key: a
  // second append with the same key is ALREADY_EXISTS, with the position
  // the first one wrote in the header fold-first-position.
  bytes idempotency_key = 5;
}

message AppendResponse {
  repeated fold.common.v1.RecordedEvent events = 1;
  uint64 first_position = 2;
  uint64 last_position = 3;
  uint64 version = 4;        // the stream's version after the append
  // Position token for read-your-writes on any node:
  // "fold1:<log_id>:<epoch>:<position>". A derivation node answers a read
  // carrying it once it has projected that position; a token of another
  // log is refused.
  string token = 5;
}

message ReadStreamRequest {
  string stream_id = 1;
  uint64 from_version = 2;
  uint32 max = 3;            // 0 = to the end
  bool backward = 4;
}

message ReadAllRequest {
  uint64 from_position = 1;
  uint32 max = 2;            // 0 = to the end
}

message ReadByTypeRequest {
  string type = 1;           // "Context.Event" (every version) or "Context.Event@vN"
  uint64 from_position = 2;
  uint32 max = 3;            // 0 = to the end
}

message StreamHeadRequest {
  string stream_id = 1;
}

message StreamHeadResponse {
  bool exists = 1;
  uint64 version = 2;        // of the last event, when exists
  string last_event_id = 3;  // its id, when exists
}

message ListStreamsRequest {
  string prefix = 1;         // empty = every stream
}

message StreamName {
  string stream_id = 1;
}

message LookupIdempotencyKeyRequest {
  bytes key = 1;
}

message LookupIdempotencyKeyResponse {
  bool found = 1;
  uint64 position = 2;       // the first position the key wrote, when found
}

message SubscribeAllRequest {
  uint64 from_position = 1;
  string last_event_id = 2;  // id of the event at from_position - 1; empty at 0
}

// What the log is, as the subscriber must know it: sent first on every
// subscription and whenever the role or epoch changes.
message LogStatus {
  string log_id = 1;
  uint64 head = 2;           // next position
  uint64 epoch = 3;
  string role = 4;           // "primary", "replica" or "fenced"
  // Bumped whenever the log moved backwards (a restore to a point in time,
  // a truncation); `cut` is the first position no longer valid then.
  // Derived data past the cut must be dropped.
  uint64 generation = 5;
  uint64 cut = 6;
  optional uint64 fenced_by = 7;
}

message LogItem {
  oneof item {
    fold.common.v1.RecordedEvent event = 1;
    LogStatus status = 2;
  }
}

message ReplicateRequest {
  uint64 from_position = 1;   // the replica's head
  string last_event_id = 2;   // id of the replica's last event (from_position - 1); empty at 0
}

message ReplicationChunk {
  string log_id = 1;
  uint64 from = 2;
  uint64 to = 3;              // exclusive; a batch boundary
  bytes frames = 4;           // the records as framed on disk
  repeated IdempotencyKey keys = 5;   // first used at a position in from..to
  uint64 head = 6;            // the primary's head when the chunk was cut
  uint64 epoch = 7;           // the primary's epoch; the replica adopts it
}

message IdempotencyKey {
  bytes key = 1;
  uint64 position = 2;
}

// ---------------------------------------------------------------------------
// Cluster: roles, failover, fencing, leases

service Cluster {
  rpc Health(HealthRequest) returns (HealthResponse);
  // Failover: a replica stops tailing and becomes a primary in place.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  // Fencing: tell this database a primary at `epoch` exists. If that is
  // newer than its own epoch it stops taking writes for good (until it is
  // made a replica of the new primary). A replica or an already fenced
  // database answers ok without changing.
  rpc Fence(FenceRequest) returns (FenceResponse);
  // Failover election: a replica that has lost its primary asks each peer
  // for its vote before promoting itself. A vote is granted once per epoch,
  // only to a candidate at least as far along, and only if the voter cannot
  // reach the primary either.
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  // Leader lease: a primary asks each peer to confirm it is still the
  // primary it knows for the next `duration_ms`. With a majority it serves
  // reads; without, it stops, so a partitioned primary cannot answer stale
  // reads. A peer that granted a lease votes for nobody else until it ends.
  rpc RenewLease(LeaseRequest) returns (LeaseResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;                   // "ok"
  string version = 2;
  uint64 uptime_secs = 3;
  uint64 head = 4;
  string log_id = 5;
  // After a RestoreLog: "ok <archive>" or "failed <archive>: <reason>".
  string last_restore = 6;
  string role = 7;                     // "primary", "replica" or "fenced"
  string replicating_from = 8;         // the primary's address, on a replica
  bool replica_connected = 9;          // streaming from the primary right now
  optional uint64 primary_head = 10;   // the primary's head as last seen
  string replication_error = 11;       // last failure, until the next chunk
  string promoted_from = 12;           // after a promotion: the former primary
  string promotion = 13;               // "promoted from <primary> at <time> by request|automatically, ..."
  uint64 auto_failover_secs = 14;      // on a replica: grace before it promotes itself; 0 = off
  optional uint64 primary_unreachable_secs = 15;  // while the primary is out of reach
  uint64 epoch = 16;                   // the fencing epoch of this log
  optional uint64 fenced_by = 17;      // role "fenced": the newer epoch that fenced it
  bool old_primary_fenced = 18;        // after a promotion: the old primary acknowledged the fence
  uint64 quorum_size = 19;             // on a replica with auto failover: peers + 1
  string last_election = 20;           // outcome of the last election round, if any
  uint64 lease_secs = 21;              // a primary with a lease configured: its duration; 0 = none
  bool lease_held = 22;                // reads are being served under a live lease
  uint64 lease_remaining_ms = 23;      // of the current lease
  string lease_error = 24;             // why the last renewal did not grant, if it did not
  string last_schema_change = 25;      // what the start-up schema check did, if the file had changed
  uint64 generation = 26;              // see LogStatus
  uint64 cut = 27;
}

message VoteRequest {
  uint64 epoch = 1;           // the epoch the candidate proposes to start
  string log_id = 2;          // the cluster's log
  string primary = 3;         // the primary the candidate lost
  uint64 candidate_head = 4;  // how far along the candidate is
  string candidate = 5;       // the candidate's own address, for the record
}

message VoteResponse {
  bool granted = 1;
  string reason = 2;          // when not granted
  uint64 voter_epoch = 3;     // the voter's current epoch
  uint64 voted_epoch = 4;     // the highest epoch the voter has voted for
  uint64 voter_head = 5;
  bool primary_reachable = 6; // the voter could reach the primary just now
}

message LeaseRequest {
  uint64 epoch = 1;           // the holder's epoch
  string log_id = 2;
  uint64 duration_ms = 3;     // how long the holder will rely on the grant
  string holder = 4;          // the holder's address, for the record
}

message LeaseResponse {
  bool granted = 1;
  string reason = 2;          // when not granted
  uint64 peer_epoch = 3;
  uint64 voted_epoch = 4;     // a vote past the holder's epoch means an election is on
}

message FenceRequest {
  uint64 epoch = 1;           // the newer primary's epoch
}

message FenceResponse {
  string role = 1;            // "fenced", "replica" or "primary" (when epoch was not newer)
  uint64 epoch = 2;           // this database's own epoch
}

message PromoteRequest {}

message PromoteResponse {
  uint64 head = 1;            // where this database starts taking writes
  string promoted_from = 2;   // the primary it was tailing
}

// ---------------------------------------------------------------------------
// Backup: archives of the log

service Backup {
  // Write a consistent backup of the whole log (index, segments, identity,
  // schema) to one archive. Derived data is not in it: derivation and
  // application nodes rebuild theirs from the restored log.
  rpc BackupLog(BackupLogRequest) returns (BackupInfo);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  // Replace the running database's log with a backup. It stops serving,
  // moves the current log aside (kept, never deleted), restores the
  // archive in its place and serves again on the same address; clients
  // reconnect. Returns once the request is accepted; poll Cluster.Health
  // for log_id, generation and last_restore.
  rpc RestoreLog(RestoreLogRequest) returns (RestoreLogResponse);
}

message BackupLogRequest {
  // Archive path on the database's host; empty = <log dir>/backups/<head>-<time>.fbak
  string path = 1;
  // Write only the records since the newest backup in the backups directory
  // (full or incremental) rather than everything. Fails if there is none.
  bool incremental = 2;
}

message BackupInfo {
  string path = 1;
  string log_id = 2;
  uint64 head = 3;            // every position below it is in the backup
  uint64 files = 4;
  uint64 bytes = 5;
  int64 created_at_unix_nanos = 6;
  bool incremental = 7;
  optional uint64 base_head = 8;   // for an incremental backup: apply onto a log at this head
}

message ListBackupsRequest {}

message ListBackupsResponse {
  repeated BackupInfo backups = 1;   // in the default backups directory, newest first
  // Present when the database runs with a backup schedule.
  optional BackupSchedule schedule = 2;
}

message BackupSchedule {
  uint64 every_secs = 1;
  uint64 keep = 2;                       // full backups retained, newest first; 0 = all
  bool incremental = 7;                  // ticks write increments since the newest backup
  uint64 full_every = 8;                 // in incremental mode, a full backup every N backups
  optional int64 last_run_unix_nanos = 3; // last attempt
  optional uint64 last_head = 4;          // head of the last backup written
  string last_error = 5;                  // empty when the last attempt succeeded
  optional int64 next_run_unix_nanos = 6;
}

message RestoreLogRequest {
  string path = 1;            // archive path on the database's host
  optional uint64 to = 2;     // point in time: keep only positions below this (a batch boundary)
  optional int64 at_unix_nanos = 3;  // or: keep every batch recorded at or before this instant
}

message RestoreLogResponse {
  string log_id = 1;          // of the archive
  uint64 head = 2;            // of the archive
}

// ---------------------------------------------------------------------------
// Schema: the domain the log is written under

service Schema {
  // The domain bundle the log was written under. Derivation and
  // application nodes compare the domain they import against it.
  rpc GetSchema(fold.common.v1.GetSchemaRequest) returns (fold.common.v1.GetSchemaResponse);
}

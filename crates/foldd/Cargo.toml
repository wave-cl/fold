[package]
name = "foldd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "fold: the daemons (the composite of the database and the derivation node, the two services, and the embed API for applications)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "foldd"
path = "src/bin/foldd.rs"

[[bin]]
name = "fold-dbd"
path = "src/bin/fold-dbd.rs"

[[bin]]
name = "fold-derived"
path = "src/bin/fold-derived.rs"

[dependencies]
fold-db = { workspace = true }
fold-derive = { workspace = true }
fold-app = { workspace = true }
fold-host = { workspace = true }
fold-wasm = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
orders-app = { workspace = true }
fold-core = { workspace = true }
fold-proto = { workspace = true }
fold-schema = { workspace = true }
fold-store = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"

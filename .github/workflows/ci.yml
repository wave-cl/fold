name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The crate list is derived rather than written out, so adding a crate
      # cannot leave it silently unchecked, and is echoed so a green run shows
      # what it covered rather than only that nothing failed.
      - name: Format
        run: |
          args=()
          while read -r n; do args+=(-p "$n"); done \
            < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          test ${#args[@]} -gt 0
          echo "checking: ${args[*]}"
          cargo fmt "${args[@]}" -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fold-proto generates its gRPC code with the system protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Honors rust-toolchain.toml, including the wasm32 target the example
      # guest needs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      # The end-to-end tests build this themselves; building it here first
      # keeps that step out of the test timing and surfaces guest build errors
      # as their own failure.
      - name: Build the example guest
        run: cargo build -p orders-guest --target wasm32-unknown-unknown --release --target-dir target/guest

      - name: Test
        run: cargo nextest run --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
